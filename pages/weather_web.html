    <div class="weather-container">
        <h1>Weather Info</h1>

        <!-- Search -->
        <form id="weatherForm">
        <input type="text" id="locationInput" placeholder="Enter city..." required>
        <button type="submit">Search</button>
        </form>

        <!-- Weather Output -->
        <div id="weatherDetails" class="weather-details">
            <div class='city-img'>

                <img id="weatherIcon" class="weather-icon" src="" alt="">
                <h3 id="condition"></h3>
            </div>
            <div class="weather-others">
                <div class="weather-item">
                    <img src="../images/thermometer.png" alt="Temp" class="icon">
                    <p id="temperature"></p>
                </div>
                <div class="weather-item">
                    <img src="../images/humidity.png" alt="Humidity" class="icon">
                    <p id="humidity"></p>
                </div>
